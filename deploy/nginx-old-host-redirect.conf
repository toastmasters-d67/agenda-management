# /etc/nginx/snippets/old-host-redirect.conf
# Included from the 443 server block of /etc/nginx/sites-enabled/postgen
# (postgen-d67.eastasia.cloudapp.azure.com) IN PLACE OF both
# club-management.conf and post-generator.conf, once both services have moved
# to clubtools.toastmasters.org.tw:
#
#     include snippets/old-host-redirect.conf;
#
# Every path keeps its place on the new domain (/post-generator/… included);
# only the pre-2026-11 /club-management prefix is dropped. 308 keeps the
# method and body. MCP clients don't follow redirects — they must be
# reconfigured to the new /api/mcp and /post-generator/mcp.

location = /club-management {
    return 308 https://clubtools.toastmasters.org.tw/;
}
location ~ ^/club-management/(.*)$ {
    return 308 https://clubtools.toastmasters.org.tw/$1$is_args$args;
}

location / {
    return 308 https://clubtools.toastmasters.org.tw$request_uri;
}

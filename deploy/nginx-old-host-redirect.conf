# /etc/nginx/snippets/old-host-redirect.conf
# Included from the 443 server block of /etc/nginx/sites-enabled/postgen
# (postgen-d67.eastasia.cloudapp.azure.com) IN PLACE OF club-management.conf,
# once the site has moved to clubtools.toastmasters.org.tw:
#
#     include snippets/old-host-redirect.conf;
#     include snippets/post-generator.conf;
#
# Everything except post-generator moves to the new domain. post-generator's
# /post-generator/ prefix and its exact /.well-known/…/post-generator matches
# win over `location /`. 308 keeps the method and body. MCP clients don't
# follow redirects — they must be reconfigured to the new /api/mcp.

location = /club-management {
    return 308 https://clubtools.toastmasters.org.tw/;
}
location ~ ^/club-management/(.*)$ {
    return 308 https://clubtools.toastmasters.org.tw/$1$is_args$args;
}

location / {
    return 308 https://clubtools.toastmasters.org.tw$request_uri;
}

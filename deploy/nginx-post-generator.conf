# /etc/nginx/snippets/post-generator.conf
# post-generator (toastmasters-d67/post-generator, /srv/post-generator) under
# /post-generator/ on the shared host. Included next to club-management.conf.
#
# The prefix is stripped here, so post-generator's own routes stay at its
# root; it learns the prefix from PUBLIC_BASE_URL=https://host/post-generator
# (links, OAuth issuer, cookie paths). Its pages use relative URLs, which is
# why the bare /post-generator has to gain its trailing slash.

location = /post-generator {
    return 308 /post-generator/;
}

location /post-generator/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Host              $host;
    proxy_read_timeout    180s;
    proxy_send_timeout    180s;
    proxy_connect_timeout 10s;
    proxy_buffering off;
    proxy_http_version 1.1;
    client_max_body_size 25m;
}

# RFC 8414 / RFC 9728 path-inserted discovery URLs for the issuer
# https://host/post-generator. MCP clients look for these at the host root.
location = /.well-known/oauth-authorization-server/post-generator {
    proxy_pass http://127.0.0.1:8000/.well-known/oauth-authorization-server;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /.well-known/oauth-protected-resource/post-generator/mcp {
    proxy_pass http://127.0.0.1:8000/.well-known/oauth-protected-resource/mcp;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# /etc/nginx/snippets/club-management.conf
# Included from the 443 server block of /etc/nginx/sites-enabled/postgen
# (the host is shared with post-generator, which owns `location /`):
#
#     include snippets/club-management.conf;
#
# Mirrors the old vercel.json rewrites under the /club-management prefix:
# /club-management/api/* and /club-management/.well-known/* go to FastAPI
# (prefix stripped), everything else under the prefix to Next.js (which has
# basePath=/club-management, so the prefix is kept).

# The basePath root itself belongs to Next.js (which redirects it to /login).
# Don't redirect it to /club-management/ here: Next.js strips trailing
# slashes with a 308 back to /club-management, which would loop.
location = /club-management {
    proxy_pass http://127.0.0.1:3000;
    include snippets/club-management-proxy.conf;
}

location /club-management/api/ {
    proxy_pass http://127.0.0.1:8001/api/;
    include snippets/club-management-proxy.conf;
}

location /club-management/.well-known/ {
    proxy_pass http://127.0.0.1:8001/.well-known/;
    include snippets/club-management-proxy.conf;
}

# RFC 8414 / RFC 9728 path-inserted discovery URLs for an issuer with a path
# (https://host/club-management). MCP clients look here at the host root.
location = /.well-known/oauth-authorization-server/club-management {
    proxy_pass http://127.0.0.1:8001/.well-known/oauth-authorization-server;
    include snippets/club-management-proxy.conf;
}
location = /.well-known/oauth-protected-resource/club-management/api/mcp {
    proxy_pass http://127.0.0.1:8001/.well-known/oauth-protected-resource;
    include snippets/club-management-proxy.conf;
}

location /club-management/ {
    proxy_pass http://127.0.0.1:3000;
    include snippets/club-management-proxy.conf;
}

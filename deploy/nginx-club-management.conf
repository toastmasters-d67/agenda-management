# /etc/nginx/snippets/club-management.conf
# Included from the 443 server block of /etc/nginx/sites-enabled/postgen,
# together with post-generator's snippet (this site owns the domain root,
# post-generator lives under /post-generator/ — see nginx-post-generator.conf):
#
#     include snippets/club-management.conf;
#     include snippets/post-generator.conf;
#
# Mirrors the old vercel.json rewrites: /api/* and /.well-known/* go to
# FastAPI, everything else to Next.js (built without NEXT_PUBLIC_BASE_PATH).

# Until 2026-11 the site lived under /club-management. Old links (bookmarks,
# shared agendas, file URLs) move to the root; 308 keeps the method and body.
# MCP clients don't follow redirects — they need the new URL (/api/mcp).
location = /club-management {
    return 308 /;
}
location ~ ^/club-management/(.*)$ {
    return 308 /$1$is_args$args;
}

location /api/ {
    proxy_pass http://127.0.0.1:8001/api/;
    include snippets/club-management-proxy.conf;
}

# OAuth discovery for MCP (issuer https://host). post-generator's
# path-inserted ones (…/post-generator) are exact matches and win over this.
location /.well-known/ {
    proxy_pass http://127.0.0.1:8001/.well-known/;
    include snippets/club-management-proxy.conf;
}

location / {
    proxy_pass http://127.0.0.1:3000;
    include snippets/club-management-proxy.conf;
}

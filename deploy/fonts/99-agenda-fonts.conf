<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Word templates are made on Windows and name Windows fonts, which the API
  image cannot ship (their licences do not allow it). LibreOffice asks
  fontconfig for them when it lays out a template (/api/word-render); these
  aliases send each to the closest font that is installed, so a PDF keeps the
  look of the Word file instead of whatever fontconfig picks by default.
  Arial / Times / Courier already map to Liberation (metric-compatible).
-->
<fontconfig>
  <alias binding="same">
    <family>Microsoft JhengHei</family>
    <prefer><family>Noto Sans CJK TC</family></prefer>
  </alias>
  <alias binding="same">
    <family>微軟正黑體</family>
    <prefer><family>Noto Sans CJK TC</family></prefer>
  </alias>
  <alias binding="same">
    <family>Microsoft YaHei</family>
    <prefer><family>Noto Sans CJK TC</family></prefer>
  </alias>
  <alias binding="same">
    <family>PMingLiU</family>
    <prefer><family>Noto Serif CJK TC</family></prefer>
  </alias>
  <alias binding="same">
    <family>新細明體</family>
    <prefer><family>Noto Serif CJK TC</family></prefer>
  </alias>
  <alias binding="same">
    <family>DFKai-SB</family>
    <prefer><family>Noto Serif CJK TC</family></prefer>
  </alias>
  <alias binding="same">
    <family>標楷體</family>
    <prefer><family>Noto Serif CJK TC</family></prefer>
  </alias>
</fontconfig>

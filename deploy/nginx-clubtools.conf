# /etc/nginx/sites-available/clubtools, enabled as
# /etc/nginx/sites-enabled/postgen-clubtools — the name must sort after
# "postgen", which defines log_format postgen_no_query.
#
# clubtools.toastmasters.org.tw is the production domain (2026-11). DNS is a
# CNAME to postgen-d67.eastasia.cloudapp.azure.com. HTTP (80) is handled by
# the 80 block in sites-available/postgen (its server_name lists this domain
# too), which serves certbot's webroot challenge and redirects to https.
#
# Certificate: certbot certonly --webroot -w /var/www/certbot \
#   -d clubtools.toastmasters.org.tw --key-type ecdsa \
#   --deploy-hook "systemctl reload nginx"
#
# post-generator stays on the old host (it rejects other Host headers), so
# only club-management.conf is included here.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clubtools.toastmasters.org.tw;

    ssl_certificate     /etc/letsencrypt/live/clubtools.toastmasters.org.tw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clubtools.toastmasters.org.tw/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/postgen.access.log postgen_no_query;
    error_log  /var/log/nginx/postgen.error.log;

    client_max_body_size 25m;
    client_body_timeout 60s;

    include snippets/club-management.conf;

    server_tokens off;
}
